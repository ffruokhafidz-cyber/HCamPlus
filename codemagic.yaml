workflows:
  hcamplus-android:
    name: HCam+ Android APK
    max_build_duration: 30
    environment:
      android_signing:
        - hcamplus_keystore
      vars:
        PACKAGE_NAME: "com.hcamplus"
      java: 17
    scripts:
      - name: Build release APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
